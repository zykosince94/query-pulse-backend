<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Query Pulse</title>
  <style>
    body { font-family: Inter, "Segoe UI", sans-serif; margin: 40px; background: #f8fafc; color: #111827; }
    .card { max-width: 520px; margin: 0 auto; background: white; border: 1px solid #dfe7f4; border-radius: 12px; padding: 24px; box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04); }
    h1, h2 { margin-top: 0; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #d1d9e6; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    button { background: #1d4ed8; color: white; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .muted { color: #5f738d; font-size: 13px; }
    .error { color: #b42318; margin-bottom: 12px; }
    .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
