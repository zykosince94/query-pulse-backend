{% extends "base.html" %}

{% block content %}
  <h1>Welcome</h1>
  <p>You are signed in as <strong>{{ request.user.username }}</strong>.</p>

  {% if request.user.username == 'demo' %}
    <p class="muted">Demo users are read-only. Changes to workload data are not allowed.</p>
  {% endif %}

  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Sign out</button>
  </form>
{% endblock %}
