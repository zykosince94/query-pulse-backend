{% extends "base.html" %}

{% block content %}
  <h1>Welcome</h1>
  <p>You are signed in as <strong>{{ username }}</strong>.</p>

  {% if is_demo %}
    <p class="muted">Demo users are read-only. Changes to workload data are not allowed.</p>
  {% endif %}

  <form method="post" action="/logout">
    <button type="submit">Sign out</button>
  </form>
{% endblock %}
