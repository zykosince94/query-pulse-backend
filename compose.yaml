services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: querypulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  app:
    build: .
    depends_on:
      - postgres
      - mongo
    ports:
      - "8000:8000"
