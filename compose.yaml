# Local demo stack: `make demo` (or `docker compose up -d --build --wait`).
#
# Every credential below is a LOCAL DEMO default, overridable from the environment or a .env
# file. Never reuse them anywhere real. Ports are bound to 127.0.0.1 so the databases (with
# these defaults, and MongoDB without auth) are reachable only from this machine.
name: query-pulse

services:
  # The app's own database: users now; sources, observations and findings later.
  app-db:
    image: postgres:16
    environment:
      POSTGRES_DB: querypulse
      POSTGRES_USER: querypulse
      POSTGRES_PASSWORD: querypulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querypulse -d querypulse"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The monitored PostgreSQL that Query Pulse observes (read-only role `querypulse_monitor`).
  demo-postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - compute_query_id=on
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
      - ./demo/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Healthy only once the extension exists, i.e. init scripts have finished.
      test:
        - CMD-SHELL
        - >-
          psql -U postgres -d shop -tAc
          "SELECT 1 FROM pg_extension WHERE extname = 'pg_stat_statements'" | grep -q 1
      interval: 5s
      timeout: 3s
      retries: 30

  # The monitored MongoDB: a single-node replica set (needed for profiler/oplog features).
  # From the host, connect with: mongodb://localhost:27017/?directConnection=true
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first run, then reports healthy once it has a primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) };
          if (!db.hello().isWritablePrimary) { quit(1) }
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30

  app:
    build: .
    image: query-pulse-backend:local
    environment: &app-env
      QP_ENVIRONMENT: dev
      QP_DATABASE_URL: postgresql+psycopg://querypulse:querypulse@app-db:5432/querypulse
      QP_SESSION_SECRET: ${QP_SESSION_SECRET:-local-demo-session-secret-not-for-real-use}
      QP_FERNET_KEY: ${QP_FERNET_KEY:-PfEbNJ7_27539NZGeLQaJnx3E43Z83JYHklSCw4_g3E=}
      QP_ADMIN_USERNAME: ${QP_ADMIN_USERNAME:-admin}
      QP_ADMIN_PASSWORD: ${QP_ADMIN_PASSWORD:-admin-demo-password}
      QP_DEMO_ENABLED: ${QP_DEMO_ENABLED:-true}
      QP_DEMO_USERNAME: ${QP_DEMO_USERNAME:-demo}
      QP_DEMO_PASSWORD: ${QP_DEMO_PASSWORD:-demo-password}
      # Point the AI assistant at an OpenAI-compatible gateway (e.g. https://openrouter.ai/api/v1).
      QP_OPENAI_BASE_URL: ${QP_OPENAI_BASE_URL:-https://api.openai.com/v1}
      QP_AI_TIMEOUT_SECONDS: ${QP_AI_TIMEOUT_SECONDS:-60}
      # A short interval keeps the local demo lively; the production default is 60 s.
      QP_COLLECTOR_INTERVAL_SECONDS: ${QP_COLLECTOR_INTERVAL_SECONDS:-15}
      # Findings in minutes instead of hours, so the demo shows P1-P4 soon after starting:
      # rules every cycle, index samples every minute, "unused" after 2 minutes of zero
      # scans (production: 60 s, 5 min and 1 hour).
      QP_RULES_INTERVAL_SECONDS: ${QP_RULES_INTERVAL_SECONDS:-15}
      QP_COLLECTOR_RELATION_STATS_SECONDS: ${QP_COLLECTOR_RELATION_STATS_SECONDS:-60}
      QP_RULES_UNUSED_INDEX_MIN_SPAN_SECONDS: ${QP_RULES_UNUSED_INDEX_MIN_SPAN_SECONDS:-120}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      app-db:
        condition: service_healthy
      demo-postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # Polls every enabled source, PostgreSQL and MongoDB (one instance only). Starts after the API, which
  # runs the migrations.
  collector:
    image: query-pulse-backend:local
    command: ["python", "-m", "query_pulse.collector"]
    environment: *app-env
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # The supervisor touches this file every loop (collector_refresh_seconds, default 30 s).
      test:
        - CMD
        - python
        - -c
        - >-
          import os, sys, time;
          p = '/tmp/query-pulse-collector-heartbeat';
          sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 120 else 1)
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Seeds the demo databases (once) and then runs the planted-problem workloads forever:
  # P1-P4 on PostgreSQL, M1-M3 on MongoDB (whose profiler the seed turns on, as a user would).
  demo-workload:
    image: query-pulse-backend:local
    command:
      - sh
      - -c
      - python -m query_pulse.demo.seed && exec python -m query_pulse.demo.workload
    environment:
      QP_DEMO_DSN: postgresql://postgres:postgres@demo-postgres:5432/shop
      QP_DEMO_WORKLOAD_DSN: postgresql://shop_app:shop-app@demo-postgres:5432/shop
      QP_DEMO_RATE: ${QP_DEMO_RATE:-20}
      QP_DEMO_CUSTOMERS: ${QP_DEMO_CUSTOMERS:-20000}
      QP_DEMO_PRODUCTS: ${QP_DEMO_PRODUCTS:-5000}
      QP_DEMO_ORDERS: ${QP_DEMO_ORDERS:-200000}
      QP_DEMO_MONGO_URL: mongodb://mongo:27017/?directConnection=true
      QP_DEMO_MONGO_RATE: ${QP_DEMO_MONGO_RATE:-10}
      QP_DEMO_MONGO_ORDERS: ${QP_DEMO_MONGO_ORDERS:-50000}
      QP_DEMO_MONGO_PRODUCTS: ${QP_DEMO_MONGO_PRODUCTS:-20000}
    depends_on:
      demo-postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      app:
        condition: service_healthy  # the image is built for `app`
    healthcheck:
      disable: true

volumes:
  app-db-data:
  demo-postgres-data:
  mongo-data:
