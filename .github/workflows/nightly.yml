name: Nightly

# Hardening (Phase 7): a one-hour soak test of the full stack under the demo workload, and a
# deeper Schemathesis run. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Soak duration in minutes
        default: "60"

jobs:
  soak:
    name: Soak test (collector memory and cycle times)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make demo
      - name: Soak
        run: uv run python scripts/soak.py --minutes "${{ github.event.inputs.minutes || '60' }}"
      - name: Container logs
        if: failure()
        run: docker compose logs --tail 500
      - if: always()
        run: docker compose down -v

  fuzz:
    name: Schemathesis (500 examples per operation)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Fuzz the API
        env:
          QP_FUZZ_EXAMPLES: "500"
        run: uv run pytest tests/test_fuzz.py
