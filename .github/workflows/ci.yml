name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy query_pulse scripts tests
      - name: openapi.json is current
        run: uv run python scripts/export_openapi.py --check
      - run: uv run pytest

  stack:
    name: make demo starts healthy (QP-AC-01, partial)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: make demo
      - name: App is ready
        run: curl -fsS http://localhost:8000/ready
      - name: Admin can sign in
        run: |
          curl -fsS -X POST http://localhost:8000/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"admin-demo-password"}'
      - name: pg_stat_statements is available to the monitoring role
        run: |
          docker compose exec -T demo-postgres \
            psql "postgresql://querypulse_monitor:monitor@localhost/shop" \
            -tAc "SELECT count(*) >= 0 FROM pg_stat_statements" | grep -q t
      - name: MongoDB replica set has a primary
        run: |
          docker compose exec -T mongo mongosh --quiet \
            --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"
      - name: Container logs
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
